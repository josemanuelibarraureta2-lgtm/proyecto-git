name: CI Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README for feature
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Actualizar README con nueva feature" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validate DEV Token
        run: |
          if [ "${{ secrets.DEV_TOKEN }}" = "$LOCAL_DEV_TOKEN" ]; then
            echo "Tokens coinciden correctamente."
          else
            echo "Error: Los tokens no coinciden."
            exit 1
          fi
